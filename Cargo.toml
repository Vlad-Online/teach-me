[workspace]
resolver = "2"
members = ["crates/core", "crates/harvester", "crates/app", "crates/mobile"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
teachme-core = { path = "crates/core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
# TLS is chosen per target in crates/core: system TLS on Windows, rustls on Android.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "blocking"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
