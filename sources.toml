# Источники видео для сборщика (harvester).
# Только португальские (pt-PT) каналы: автосубтитры YouTube не отличают pt-PT от pt-BR,
# поэтому вариант языка гарантируется выбором каналов.
#
# kind: news | show | vlog. Он влияет только на статистику и на разнообразие выборки.
# max_videos: сколько последних видео брать с канала (по умолчанию harvest.videos_per_source).

